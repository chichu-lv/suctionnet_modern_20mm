schema_version: suction20.pretrain.v1
experiment: E5
seed: 42
sampling_seed: 20261110
data:
  source_root: /path/to/SuctionNet
  label_root: /path/to/suction20_output
  frozen_label_config: /path/to/suction20_output/config_frozen.json
  camera: realsense
  source_format: legacy_dc4ad6b
  compatibility: auto
  legacy_producer: dc4ad6b00535c89ece1feef2751ba86006e5f97e
  adapter_read_only: true
  adapter_cache: null
  official_train_scene_ids:
    start: 0
    end_inclusive: 99
  validation_rule: scene_id_mod_10_equals_9
  views_per_train_scene_per_epoch: 64
  validation_frame_ids:
    start: 0
    stop_exclusive: 256
    step: 8
  instance_input: gt_mask
  keep_instance_gt_separate: true
  observation_normals: stored_or_rebuild_from_original_depth
  quality_valid: gt_valid_and_foreground_gt
  axis_valid: matched_finite_candidate_axis_and_valid_observed_normal
model:
  name: suction20net
  backbone: spconv_resunet14
  voxel_size_m: 0.002
  point_feature_dim: 256
  instance_feature_dim: 128
  seed_count: 512
  use_instance_fusion: true
  use_contact_grouping: true
  use_aux_heads: true
  use_task_success_head: false
  quality_target: gt_B
  normal_target: gt_normal_original_candidate_axis
  normal_parameterization: tangent_residual
  normal_max_tilt_deg: 30.0
  group_samples:
    core: 32
    lip: 64
    cup: 32
    mount: 32
    approach: 32
  physical_geometry_source: frozen_label_config
  seal_normalization_source: frozen_label_config
  backbone_root: external/graspness_modern
  dense_chunk_size: 16384
  checkpoint_dense: true
sampling:
  instance_balanced: true
  high_A_threshold: 0.2
  warmup_epochs: 2
  warmup_fractions:
    proposal: 0.0
    high_A: 0.5
    low_A: 0.5
  main_fractions:
    proposal: 0.5
    high_A: 0.25
    low_A: 0.25
  grouping_axis: detached_predicted_normal
augmentation:
  scale: false
  yaw_about_gravity_deg:
  - -180.0
  - 180.0
  translation_in_table_plane_m:
  - -0.02
  - 0.02
  depth_noise_std_m: 0.0005
  depth_noise_clip_m: 0.0015
  point_dropout_fraction:
  - 0.0
  - 0.05
  update_observed_normals_after_geometry_noise: true
  transform_gravity_with_coordinates: true
loss:
  smooth_l1_beta: 0.05
  weights:
    q: 1.0
    q0: 1.0
    normal: 2.0
    seal: 0.5
    wrench: 0.25
    collision_free: 0.1
  reduction: instance_mean_then_frame_mean_then_batch_mean
optimizer:
  name: AdamW
  lr_peak: 0.001
  weight_decay: 0.0001
  no_weight_decay:
  - bias
  - normalization_parameters
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  grad_clip_norm: 10.0
training:
  epochs: 40
  max_optimizer_steps: 57600
  world_size: 1
  microbatch_size: 1
  gradient_accumulation_steps: 4
  effective_batch_size: 4
  amp: true
  bn_mode: train
  validate_every_optimizer_steps: 5760
scheduler:
  name: linear_warmup_cosine
  unit: successful_optimizer_step
  warmup_optimizer_steps: 2880
  warmup_start_lr: 1.0e-05
  final_lr: 1.0e-05
  total_optimizer_steps: 57600
checkpoint:
  save_last: true
  save_best: true
  selection_metric: instance_Top1_Q20_at_0_4
  selection_tiebreak_metric: AP_R20
  save_at_optimizer_boundary: true
ranking:
  final_score: q
  uncertainty_lambda: 0.0
  nms_distance_m: 0.01
  nms_angle_deg: 15.0
  max_per_instance: 10
  max_per_scene: 50
runtime:
  cpu_threads: 8
  gpu_memory_limit_gib: 64
